name: Jakarta EE CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests during build'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '11'
  MAVEN_VERSION: '3.9.4'
  PROJECT_DIR: 'pahana_edu_rest'  # Directory containing pom.xml

jobs:
  # Job 1: Code Quality and Security
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verify project structure
        run: |
          echo "Repository structure:"
          ls -la
          echo "Looking for pom.xml:"
          find . -name "pom.xml" -type f
          echo "Project directory contents:"
          ls -la ${{ env.PROJECT_DIR }}/

      - name: Verify Maven configuration
        run: |
          cd ${{ env.PROJECT_DIR }}
          mvn help:effective-pom

      - name: Run Maven validate
        run: |
          cd ${{ env.PROJECT_DIR }}
          mvn validate

      - name: Check for security vulnerabilities
        run: |
          cd ${{ env.PROJECT_DIR }}
          mvn org.owasp:dependency-check-maven:check

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Job 3: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    needs: [quick-build]  # Ensure basic compilation works first
    if: ${{ !inputs.skip_tests }}
    strategy:
      matrix:
        java-version: [11]  # Start with Java 11 only to reduce complexity
      fail-fast: false  # Don't cancel other jobs if one fails
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pahana_edu_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Setup test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS pahana_edu_test;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON pahana_edu_test.* TO 'test_user'@'%';"

      - name: Compile project
        run: |
          cd ${{ env.PROJECT_DIR }}
          mvn clean compile

      - name: Run tests
        run: |
          echo "Running tests with detailed output..."
          cd ${{ env.PROJECT_DIR }}
          mvn test -X -e || echo "Tests failed, but continuing to upload reports..."
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: pahana_edu_test
          DB_USER: test_user
          DB_PASSWORD: test_password
        continue-on-error: true

      - name: Generate test report
        run: |
          cd ${{ env.PROJECT_DIR }}
          mvn surefire-report:report || echo "Test report generation failed"
        continue-on-error: true

      - name: Display test failures
        if: always()
        run: |
          echo "=== Test Results Summary ==="
          cd ${{ env.PROJECT_DIR }}
          if [ -d "target/surefire-reports" ]; then
            echo "Found surefire reports directory"
            ls -la target/surefire-reports/
            echo "=== Failed Test Details ==="
            find target/surefire-reports -name "*.txt" -exec echo "File: {}" \; -exec cat {} \; -exec echo "" \;
          else
            echo "No surefire reports directory found"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            ${{ env.PROJECT_DIR }}/target/surefire-reports/
            ${{ env.PROJECT_DIR }}/target/site/surefire-report.html

  # Job 4: Package and Build WAR
  package:
    runs-on: ubuntu-latest
    needs: [code-quality, quick-build]
    # Run package job even if tests are skipped or fail
    if: always() && (needs.code-quality.result == 'success') && (needs.quick-build.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build WAR file
        run: |
          echo "Building WAR file (skipping tests for now)..."
          cd ${{ env.PROJECT_DIR }}
          mvn clean package -DskipTests -q
          echo "Build completed successfully"
          ls -la target/

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pahana-edu-rest-war
          path: ${{ env.PROJECT_DIR }}/target/*.war
          retention-days: 30

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: |
          cd ${{ env.PROJECT_DIR }}
          cat > Dockerfile << 'EOF'
          FROM payara/server-full:6.2024.9-jdk11
          
          # Copy WAR file to deployments directory
          COPY target/*.war $DEPLOY_DIR/
          
          # Expose ports
          EXPOSE 8080 4848 9009
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
            CMD curl -f http://localhost:8080/pahana_edu_rest/health || exit 1
          
          CMD ["java", "-jar", "/opt/payara/payara-micro.jar", "--deploy", "/opt/payara/deployments"]
          EOF

      - name: Setup Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            pahana-edu-rest
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 5: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: pahana-edu-rest-war
          path: ${{ env.PROJECT_DIR }}/target/

      - name: Run OWASP ZAP security scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080/pahana_edu_rest'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pahana-edu-rest:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 6: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [package, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy to GlassFish/Payara staging
        run: |
          echo "Deploying WAR to staging environment..."
          # Example deployment commands:
          # curl -X POST -H "Content-Type: application/octet-stream" \
          #   --data-binary @target/pahana_edu_rest-1.0-SNAPSHOT.war \
          #   "http://staging-server:4848/management/domain/applications/application"
          
          # Or using asadmin:
          # asadmin deploy --host staging-server --port 4848 \
          #   --user admin --passwordfile .asadminpass \
          #   target/pahana_edu_rest-1.0-SNAPSHOT.war

      - name: Wait for deployment
        run: |
          echo "Waiting for application to be ready..."
          timeout 300 bash -c 'until curl -f http://staging-server:8080/pahana_edu_rest/health; do sleep 5; done'

      - name: Run integration tests
        run: |
          echo "Running integration tests against staging..."
          # mvn test -Dtest=IntegrationTest -Dbase.url=http://staging-server:8080/pahana_edu_rest

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: 'Staging deployment successful for pahana_edu_rest'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Job 7: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [package, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: pahana-edu-rest-war
          path: ${{ env.PROJECT_DIR }}/target/

      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Production deployment of pahana_edu_rest'
            });

      - name: Deploy to Production GlassFish/Payara
        run: |
          echo "Deploying WAR to production environment..."
          # Production deployment commands
          # kubectl create configmap app-config --from-file=config/
          # kubectl apply -f k8s/production/
          
          # Or direct server deployment:
          # asadmin deploy --host prod-server --port 4848 \
          #   --user admin --passwordfile .asadminpass \
          #   --force target/pahana_edu_rest-1.0-SNAPSHOT.war

      - name: Database migration (if needed)
        run: |
          echo "Running database migrations..."
          # flyway migrate -url=jdbc:mysql://prod-db:3306/pahana_edu
          # or liquibase update

      - name: Smoke tests
        run: |
          echo "Running production smoke tests..."
          timeout 300 bash -c 'until curl -f https://api.yourdomain.com/pahana_edu_rest/health; do sleep 5; done'
          # curl -f https://api.yourdomain.com/pahana_edu_rest/api/status

      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deploy.outputs.deployment-id }}',
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              environment_url: 'https://api.yourdomain.com/pahana_edu_rest'
            });

  # Job 8: Performance Testing
  performance-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run JMeter performance tests
        run: |
          # Download and setup JMeter
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.zip
          unzip apache-jmeter-5.6.2.zip
          
          # Run performance tests
          echo "Running JMeter performance tests..."
          # ./apache-jmeter-5.6.2/bin/jmeter -n -t performance-tests/api-load-test.jmx \
          #   -l performance-results.jtl -Jhost=staging-server -Jport=8080

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.jtl

  # Job 9: Cleanup and Notification
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, performance-test]
    if: always()
    steps:
      - name: Final notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "Jakarta EE Deployment Pipeline Completed",
              "attachments": [
                {
                  "color": "${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Clean up old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => {
                const ageInDays = (Date.now() - new Date(artifact.created_at).getTime()) / (1000 * 60 * 60 * 24);
                return ageInDays > 30;
              });
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
