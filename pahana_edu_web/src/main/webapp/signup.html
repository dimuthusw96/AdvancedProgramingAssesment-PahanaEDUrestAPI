<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center">Sign Up</h2>
    <div class="card p-4 col-md-6 mx-auto">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Username</label>
        <input type="text" class="form-control" id="newUsername" required>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="newPassword" required>
      </div>
      <button class="btn btn-success w-100" onclick="signup()">Sign Up</button>
      <div id="signupMessage" class="mt-3"></div>
      <div class="mt-3 text-center">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script>
      
      async function isUsernameTaken(username) {
  const response = await fetch("http://localhost:8080/pahana_edu_rest/api/user/alreadyuser", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userName: username })
  });

  if (!response.ok) {
    // Handle error or assume username not taken
    return false;
  }

  // The response body is a boolean (true/false)
  const exists = await response.json(); // directly true or false
  return exists;
}

async function signup() {
  const msg = document.getElementById("signupMessage");
  const usernameInput = document.getElementById("newUsername").value.trim();
  const passwordInput = document.getElementById("newPassword").value;

  if (!usernameInput || !passwordInput) {
    msg.textContent = "Please enter username and password.";
    msg.className = "text-danger mt-2";
    return;
  }

  const taken = await isUsernameTaken(usernameInput);
  if (taken) {
    msg.textContent = "Username is already taken. Please choose another.";
    msg.className = "text-danger mt-2";
    return;
  }

  // Proceed with signup
  const user = {
    userName: usernameInput,
    password: passwordInput
  };

  const res = await fetch("http://localhost:8080/pahana_edu_rest/api/user/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(user)
  });

  if (res.ok) {
    msg.textContent = "Signup successful! You can now log in.";
    msg.className = "text-success mt-2";
  } else {
    msg.textContent = "Signup failed.";
    msg.className = "text-danger mt-2";
  }
}

   
  </script>
</body>
</html>
