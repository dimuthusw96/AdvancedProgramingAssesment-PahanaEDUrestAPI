<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center">Sign Up</h2>
    <div class="card p-4 col-md-6 mx-auto">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Username</label>
        <input type="text" class="form-control" id="newUsername" required>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="newPassword" required>
      </div>
      <button class="btn btn-success w-100" onclick="signup()">Sign Up</button>
      <div id="signupMessage" class="mt-3"></div>
      <div class="mt-3 text-center">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script>
    
       // Simple SHA-256 hashing (matches signup if you're using basic hashing)
    async function hashPassword(password) {
      try {
        // Encode password as UTF-8
        const encoder = new TextEncoder();
        const passwordBuffer = encoder.encode(password);
        
        // Hash with SHA-256
        const hashBuffer = await crypto.subtle.digest('SHA-256', passwordBuffer);
        
        // Convert to hex string
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (error) {
        console.error('Password hashing error:', error);
        throw new Error('Password processing failed');
      }
    }

    async function isUsernameTaken(username) {
      const response = await fetch("http://localhost:8080/pahana_edu_rest/api/user/alreadyuser", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userName: username })
      });

      if (!response.ok) {
        return false;
      }

      const exists = await response.json();
      return exists;
    }

    async function signup() {
      const msg = document.getElementById("signupMessage");
      const usernameInput = document.getElementById("newUsername").value.trim();
      const passwordInput = document.getElementById("newPassword").value;

      // Clear previous messages
      msg.textContent = '';
      msg.className = '';

      if (!usernameInput || !passwordInput) {
        showError(msg, "Please enter username and password.");
        return;
      }

      if (passwordInput.length < 8) {
        showError(msg, "Password must be at least 8 characters long.");
        return;
      }

      try {
        // Check if username is available
        const taken = await isUsernameTaken(usernameInput);
        if (taken) {
          showError(msg, "Username is already taken. Please choose another.");
          return;
        }

        // Hash the password
        msg.textContent = "Processing...";
           const hashedPassword = await hashPassword(passwordInput);

        // Create user account
        const res = await fetch("http://localhost:8080/pahana_edu_rest/api/user/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userName: usernameInput,
            password: hashedPassword,
          
          })
        });

        if (res.ok) {
          showSuccess(msg, "Signup successful! You can now log in.");
          document.getElementById("newUsername").value = "";
          document.getElementById("newPassword").value = "";
        } else {
          const error = await res.json();
          showError(msg, error.message || "Signup failed. Please try again.");
        }
      } catch (error) {
        console.error("Signup error:", error);
        showError(msg, error.message || "An error occurred. Please try again.");
      }
    }

    function showError(element, message) {
      element.textContent = message;
      element.className = "text-danger mt-2";
    }

    function showSuccess(element, message) {
      element.textContent = message;
      element.className = "text-success mt-2";
    }
  </script>
</body>
</html>
