<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center">Sign Up</h2>
    <div class="card p-4 col-md-6 mx-auto">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Username</label>
        <input type="text" class="form-control" id="newUsername" required>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="newPassword" required>
      </div>
      <button class="btn btn-success w-100" onclick="signup()">Sign Up</button>
      <div id="signupMessage" class="mt-3"></div>
      <div class="mt-3 text-center">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script>
 // Function to hash password using SHA-256
    function hashPassword(password) {
      return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
    }

    async function isUsernameTaken(username) {
      const response = await fetch("http://localhost:8080/pahana_edu_rest/api/user/alreadyuser", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userName: username })
      });

      if (!response.ok) {
        // Handle error or assume username not taken
        return false;
      }

      // The response body is a boolean (true/false)
      const exists = await response.json();
      return exists;
    }

    async function signup() {
      const msg = document.getElementById("signupMessage");
      const usernameInput = document.getElementById("newUsername").value.trim();
      const passwordInput = document.getElementById("newPassword").value;

      if (!usernameInput || !passwordInput) {
        msg.textContent = "Please enter username and password.";
        msg.className = "text-danger mt-2";
        return;
      }

      if (passwordInput.length < 8) {
        msg.textContent = "Password must be at least 8 characters long.";
        msg.className = "text-danger mt-2";
        return;
      }

      const taken = await isUsernameTaken(usernameInput);
      if (taken) {
        msg.textContent = "Username is already taken. Please choose another.";
        msg.className = "text-danger mt-2";
        return;
      }

      // Hash the password before sending
      const hashedPassword = hashPassword(passwordInput);

      // Proceed with signup
      const user = {
        userName: usernameInput,
        password: hashedPassword  // Send the hashed password
      };

      try {
        const res = await fetch("http://localhost:8080/pahana_edu_rest/api/user/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user)
        });

        if (res.ok) {
          msg.textContent = "Signup successful! You can now log in.";
          msg.className = "text-success mt-2";
          // Clear form after successful signup
          document.getElementById("newUsername").value = "";
          document.getElementById("newPassword").value = "";
        } else {
          const errorData = await res.json();
          msg.textContent = errorData.message || "Signup failed. Please try again.";
          msg.className = "text-danger mt-2";
        }
      } catch (error) {
        msg.textContent = "Network error. Please try again.";
        msg.className = "text-danger mt-2";
        console.error("Signup error:", error);
      }
    }
   
  </script>
</body>
</html>
