    <span id="username"></span>

      margin-top: 20px;

      border-left: 4px solid #007bff;
      border-radius: 6px;
      cursor: pointer;

    </div>

  <script>
   function checkLogin() {
  const user = JSON.parse(sessionStorage.getItem("user"));
  if (!user) {
    window.location.href = "login.html";
  } else {
    const greeting = getGreeting();
    document.getElementById("username").innerText = `${greeting}, ${user.userName}`;
  }
}

    function logout() {
      sessionStorage.clear();
      window.location.href = "login.html";
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.style.display = sidebar.style.display === "none" ? "block" : "none";
    }

    function toggleSubMenuCustomer() {
      const submenu = document.getElementById("customerSubMenu");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }
    
     function toggleSubMenuItem() {
      const submenu = document.getElementById("itemSubMenu");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }
    
    function toggleSubMenubilling() {
      const submenu = document.getElementById("billingSubMenu");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }
function toggleSubMenureport() {
      const submenu = document.getElementById("reportSubMenu");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }
   function loadPage(pagePath) {
  fetch(pagePath)
    .then(res => res.text())
    .then(html => {
      const content = document.getElementById("content");
      content.innerHTML = html;

      // Manually re-run any <script> tags inside the loaded HTML
      const scripts = content.querySelectorAll("script");
      scripts.forEach(script => {
        const newScript = document.createElement("script");
        if (script.src) {
          newScript.src = script.src;
        } else {
          newScript.textContent = script.textContent;
        }
        document.body.appendChild(newScript); // runs the script
        script.remove(); // optional: clean up
      });
    })
    .catch(error => {
      document.getElementById("content").innerHTML = "<p>Page failed to load</p>";
      console.error("Error loading page:", error);
    });
}
function getGreeting() {
  const hour = new Date().getHours();
  if (hour < 12) {
    return "Good Morning";
  } else if (hour < 18) {
    return "Good Afternoon";
  } else {
    return "Good Evening";
  }
}
  </script>
