<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center">Login</h2>
    <div class="card p-4 col-md-6 mx-auto">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Login</button>
      <div id="message" class="mt-3"></div>
      <div class="mt-3 text-center">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
     // Simple SHA-256 hashing (matches signup if you're using basic hashing)
    async function hashPassword(password) {
      try {
        // Encode password as UTF-8
        const encoder = new TextEncoder();
        const passwordBuffer = encoder.encode(password);
        
        // Hash with SHA-256
        const hashBuffer = await crypto.subtle.digest('SHA-256', passwordBuffer);
        
        // Convert to hex string
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (error) {
        console.error('Password hashing error:', error);
        throw new Error('Password processing failed');
      }
    }
    async function login() {
      const msg = document.getElementById("message");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      // Clear previous messages
      msg.textContent = '';
      msg.className = '';

      if (!username || !password) {
        showError(msg, "Please enter both username and password.");
        return;
      }

      try {
        msg.textContent = "Authenticating...";
        
        // Hash the password
        const hashedPassword = await hashPassword(password);

        // Validate credentials
        const res = await fetch("http://localhost:8080/pahana_edu_rest/api/user/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userName: username,
            password: hashedPassword
          })
        });

        if (res.ok) {
          const userData = await res.json();
          sessionStorage.setItem("user", JSON.stringify(userData));
          window.location.href = "home.html";
        } else {
          showError(msg, "Invalid username or password.");
        }
      } catch (error) {
        console.error("Login error:", error);
        showError(msg, "An error occurred. Please try again.");
      }
    }

    function showError(element, message) {
      element.textContent = message;
      element.className = "text-danger mt-2";
    }
  </script>
</body>
</html>
