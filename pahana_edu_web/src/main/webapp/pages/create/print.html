<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Bill - Pahana Edu</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    h2, h4 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table, th, td { border: 1px solid #000; }
    th, td { padding: 8px; text-align: center; }
    .signature-section { margin-top: 60px; display: flex; justify-content: space-between; }
    .signature-box { width: 40%; text-align: center; }
    #printBtn { margin: 20px 0; }
  </style>
</head>
<body onload="loadBill()">
  <button id="printBtn" onclick="window.print()">🖨️ Print</button>

  <h2>Pahana Edu</h2>
  <h4>Invoice</h4>

  <div><strong>Bill ID:</strong> <span id="billId"></span></div>
  <div><strong>Customer:</strong> <span id="customerName"></span></div>
  <div><strong>Date:</strong> <span id="billDate"></span></div>

  <table>
    <thead>
      <tr>
        <th>Item ID</th>
        <th>Item Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody id="billItems"></tbody>
    <tfoot>
      <tr>
        <td colspan="4"><strong>Total</strong></td>
        <td id="totalAmount"></td>
      </tr>
    </tfoot>
  </table>

  <div class="signature-section">
    <div class="signature-box">
      -----------------------------<br>
      Customer Signature
    </div>
    <div class="signature-box">
      -----------------------------<br>
      Authorized Signature
    </div>
  </div>

  <script>
    function formatDateTime(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    function loadBill() {
      const params = new URLSearchParams(window.location.search);
      const billId = params.get("billId");
      if (!billId) return alert("No bill ID provided");

      // You should create a GET endpoint like: /api/bills/{id}
      fetch(`http://localhost:8080/pahana_edu_rest/api/bills/${billId}`)
        .then(res => {
          if (!res.ok) throw new Error("Failed to load bill");
          return res.json();
        })
        .then(bill => {
          document.getElementById("billId").textContent = bill.id;
          document.getElementById("customerName").textContent = bill.customer.name;
          document.getElementById("billDate").textContent = formatDateTime(bill.billDate);
          document.getElementById("totalAmount").textContent = bill.totalAmount.toFixed(2);

          const tbody = document.getElementById("billItems");
          tbody.innerHTML = "";
          bill.billItems.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${item.item.id}</td>
              <td>${item.item.name}</td>
              <td>${item.price.toFixed(2)}</td>
              <td>${item.quantity}</td>
              <td>${item.subtotal.toFixed(2)}</td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(err => alert(err.message));
    }
  </script>
</body>
</html>
