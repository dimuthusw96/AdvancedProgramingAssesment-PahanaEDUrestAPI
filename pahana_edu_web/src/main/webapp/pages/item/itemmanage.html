<div class="container mt-4">
        <h2 class="text-center mb-4">Item Management System</h2>
        
        <!-- Nav Tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="view-tab" data-bs-toggle="tab" data-bs-target="#view" type="button" role="tab">View Items</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="add-tab" data-bs-toggle="tab" data-bs-target="#add" type="button" role="tab">Add Item</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="update-tab" data-bs-toggle="tab" data-bs-target="#update" type="button" role="tab">Update Item</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="delete-tab" data-bs-toggle="tab" data-bs-target="#delete" type="button" role="tab">Delete Item</button>
            </li>
        </ul>
        
        <!-- Tab Content -->
        <div class="tab-content p-3 border border-top-0 rounded-bottom" id="myTabContent">
            <!-- View Tab -->
            <div class="tab-pane fade show active" id="view" role="tabpanel">
                <div class="search-section">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="searchId" class="col-form-label">Search by ID:</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" id="searchId" class="form-control">
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="searchItemById()">Search</button>
                            <button class="btn btn-secondary" onclick="loadAllItems()">Show All</button>
                        </div>
                    </div>
                </div>

                <div id="viewMessage" class="message"></div>

                <div class="table-responsive">
                    <table id="itemTable" class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="itemTableBody"></tbody>
                    </table>
                </div>
            </div>
            
            <!-- Add Tab -->
            <div class="tab-pane fade" id="add" role="tabpanel">
                <h3 class="mb-4">Add New Item</h3>
                <form id="addForm">
                    <div class="mb-3 row">
                        <label for="addItemId" class="col-sm-2 col-form-label">Item ID:</label>
                        <div class="col-sm-10">
                            <input type="number" class="form-control" id="addItemId" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="addItemName" class="col-sm-2 col-form-label">Item Name:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="addItemName" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="addItemPrice" class="col-sm-2 col-form-label">Price:</label>
                        <div class="col-sm-10">
                            <input type="number" step="0.01" class="form-control" id="addItemPrice" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="addItemQty" class="col-sm-2 col-form-label">Quantity:</label>
                        <div class="col-sm-10">
                            <input type="number" class="form-control" id="addItemQty" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col-sm-10 offset-sm-2">
                            <button type="button" class="btn btn-success" onclick="addItem()">
                                <i class="bi bi-plus-circle"></i> Add Item
                            </button>
                        </div>
                    </div>
                </form>
                <div id="addMessage" class="message"></div>
            </div>
            
            <!-- Update Tab -->
            <div class="tab-pane fade" id="update" role="tabpanel">
                <h3 class="mb-4">Update Item</h3>
                <div class="search-section">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="updateSearchId" class="col-form-label">Search by ID:</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" id="updateSearchId" class="form-control">
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="searchItemForUpdate()">Search</button>
                        </div>
                    </div>
                </div>

                <div id="updateSearchMessage" class="message"></div>

                <form id="updateForm" style="display: none;">
                    <input type="hidden" id="updateItemId">
                    <div class="mb-3 row">
                        <label for="updateItemName" class="col-sm-2 col-form-label">Item Name:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="updateItemName" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="updateItemPrice" class="col-sm-2 col-form-label">Price:</label>
                        <div class="col-sm-10">
                            <input type="number" step="0.01" class="form-control" id="updateItemPrice" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="updateItemQty" class="col-sm-2 col-form-label">Quantity:</label>
                        <div class="col-sm-10">
                            <input type="number" class="form-control" id="updateItemQty" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col-sm-10 offset-sm-2">
                            <button type="button" class="btn btn-primary" onclick="updateItem()">
                                <i class="bi bi-pencil-square"></i> Update Item
                            </button>
                        </div>
                    </div>
                </form>
                <div id="updateMessage" class="message"></div>
            </div>
            
            <!-- Delete Tab -->
            <div class="tab-pane fade" id="delete" role="tabpanel">
                <h3 class="mb-4">Delete Item</h3>
                <div class="search-section">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="deleteSearchId" class="col-form-label">Search by ID:</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" id="deleteSearchId" class="form-control">
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="searchItemForDelete()">Search</button>
                        </div>
                    </div>
                </div>

                <div id="deleteSearchMessage" class="message"></div>

                <div id="deleteItemDetails" class="card mt-3" style="display: none;">
                    <div class="card-header">
                        <h5>Item Details</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Name:</strong> <span id="deleteItemName"></span></p>
                        <p><strong>Price:</strong> <span id="deleteItemPrice"></span></p>
                        <p><strong>Quantity:</strong> <span id="deleteItemQty"></span></p>
                        <button class="btn btn-danger" onclick="confirmDelete()">
                            <i class="bi bi-trash"></i> Delete Item
                        </button>
                    </div>
                </div>
                <div id="deleteMessage" class="message"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // View Tab Functions
        function loadAllItems() {
            fetch("http://localhost:8080/pahana_edu_rest/api/items")
                .then(res => {
                    if (!res.ok) throw new Error("Failed to load items");
                    return res.json();
                })
                .then(items => {
                    populateItemTable(items);
                    showMessage("viewMessage", "✅ Loaded all items", "success-message");
                })
                .catch(err => {
                    showMessage("viewMessage", "❌ " + err.message, "error-message");
                    document.getElementById("itemTableBody").innerHTML = "";
                });
        }

        function searchItemById() {
            const id = document.getElementById("searchId").value;
            if (!id) {
                showMessage("viewMessage", "❌ Please enter an ID", "error-message");
                return;
            }

            fetch(`http://localhost:8080/pahana_edu_rest/api/items/${id}`)
                .then(res => {
                    if (!res.ok) throw new Error("Item not found");
                    return res.json();
                })
                .then(item => {
                    populateItemTable([item]);
                    showMessage("viewMessage", `✅ Showing item ID ${item.id}`, "success-message");
                })
                .catch(err => {
                    showMessage("viewMessage", "❌ " + err.message, "error-message");
                    document.getElementById("itemTableBody").innerHTML = "";
                });
        }

        function populateItemTable(items) {
            const tbody = document.getElementById("itemTableBody");
            tbody.innerHTML = "";

            if (items.length === 0) {
                showMessage("viewMessage", "No items found", "error-message");
                return;
            }

            items.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>
                        <button class="btn btn-sm btn-primary action-btn" onclick="openUpdateTab(${item.id})">
                            <i class="bi bi-pencil"></i> Update
                        </button>
                        <button class="btn btn-sm btn-danger action-btn" onclick="openDeleteTab(${item.id})">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Add Tab Functions
        function addItem() {
            const quantity = parseInt(document.getElementById("addItemQty").value);
            if (quantity === 0) {
                showMessage("addMessage", "❌ Quantity must be greater than 0", "error-message");
                return;
            }

            const item = {
                id: parseInt(document.getElementById("addItemId").value),
                name: document.getElementById("addItemName").value,
                price: parseFloat(document.getElementById("addItemPrice").value),
                quantity: quantity
            };

            fetch("http://localhost:8080/pahana_edu_rest/api/items", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(item)
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to add item");
                return res.json();
            })
            .then(data => {
                showMessage("addMessage", "✅ Item added successfully", "success-message");
                document.getElementById("addForm").reset();
                // Refresh the view tab
                loadAllItems();
            })
            .catch(err => {
                showMessage("addMessage", "❌ " + err.message, "error-message");
            });
        }

        // Update Tab Functions
        function searchItemForUpdate() {
            const id = document.getElementById("updateSearchId").value;
            if (!id) {
                showMessage("updateSearchMessage", "❌ Please enter an ID", "error-message");
                return;
            }

            fetch(`http://localhost:8080/pahana_edu_rest/api/items/${id}`)
                .then(res => {
                    if (!res.ok) throw new Error("Item not found");
                    return res.json();
                })
                .then(item => {
                    document.getElementById("updateItemId").value = item.id;
                    document.getElementById("updateItemName").value = item.name;
                    document.getElementById("updateItemPrice").value = item.price;
                    document.getElementById("updateItemQty").value = item.quantity;
                    document.getElementById("updateForm").style.display = "block";
                    showMessage("updateSearchMessage", `✅ Found item: ${item.name}`, "success-message");
                    showMessage("updateMessage", "", "");
                })
                .catch(err => {
                    document.getElementById("updateForm").style.display = "none";
                    showMessage("updateSearchMessage", "❌ " + err.message, "error-message");
                });
        }

        function updateItem() {
            const updatedItem = {
                id: parseInt(document.getElementById("updateItemId").value),
                name: document.getElementById("updateItemName").value,
                price: parseFloat(document.getElementById("updateItemPrice").value),
                quantity: parseInt(document.getElementById("updateItemQty").value)
            };

            fetch(`http://localhost:8080/pahana_edu_rest/api/items/${updatedItem.id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedItem)
            })
            .then(res => {
                if (!res.ok) throw new Error("Update failed");
                return res.json();
            })
            .then(data => {
                showMessage("updateMessage", "✅ Item updated successfully", "success-message");
                document.getElementById("updateForm").reset();
                document.getElementById("updateForm").style.display = "none";
                // Refresh the view tab
                loadAllItems();
            })
            .catch(err => {
                showMessage("updateMessage", "❌ " + err.message, "error-message");
            });
        }

        function openUpdateTab(id) {
            document.getElementById("updateSearchId").value = id;
            searchItemForUpdate();
            // Switch to update tab
            const updateTab = new bootstrap.Tab(document.getElementById('update-tab'));
            updateTab.show();
        }

        // Delete Tab Functions
        function searchItemForDelete() {
            const id = document.getElementById("deleteSearchId").value;
            if (!id) {
                showMessage("deleteSearchMessage", "❌ Please enter an ID", "error-message");
                return;
            }

            fetch(`http://localhost:8080/pahana_edu_rest/api/items/${id}`)
                .then(res => {
                    if (!res.ok) throw new Error("Item not found");
                    return res.json();
                })
                .then(item => {
                    document.getElementById("deleteItemName").textContent = item.name;
                    document.getElementById("deleteItemPrice").textContent = item.price;
                    document.getElementById("deleteItemQty").textContent = item.quantity;
                    document.getElementById("deleteItemDetails").style.display = "block";
                    showMessage("deleteSearchMessage", `✅ Found item: ${item.name}`, "success-message");
                    showMessage("deleteMessage", "", "");
                })
                .catch(err => {
                    document.getElementById("deleteItemDetails").style.display = "none";
                    showMessage("deleteSearchMessage", "❌ " + err.message, "error-message");
                });
        }

        function confirmDelete() {
            const id = document.getElementById("deleteSearchId").value;
            if (!confirm("Are you sure you want to delete this item?")) return;

            fetch(`http://localhost:8080/pahana_edu_rest/api/items/${id}`, {
                method: "DELETE"
            })
            .then(res => {
                if (!res.ok) throw new Error("Delete failed");
                showMessage("deleteMessage", "✅ Item deleted successfully", "success-message");
                document.getElementById("deleteItemDetails").style.display = "none";
                document.getElementById("deleteSearchId").value = "";
                // Refresh the view tab
                loadAllItems();
            })
            .catch(err => {
                showMessage("deleteMessage", "❌ " + err.message, "error-message");
            });
        }

        function openDeleteTab(id) {
            document.getElementById("deleteSearchId").value = id;
            searchItemForDelete();
            // Switch to delete tab
            const deleteTab = new bootstrap.Tab(document.getElementById('delete-tab'));
            deleteTab.show();
        }

        // Helper function
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
        }

        // Load all items when page loads
        loadAllItems();
    </script>
