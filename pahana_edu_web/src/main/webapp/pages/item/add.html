<h3>Create New Item</h3>

<form id="itemForm" onsubmit="event.preventDefault(); createItem();">
  <label>Item ID:</label>
  <input type="number" id="itemId" required><br>

  <label>Item Name:</label>
  <input type="text" id="itemName" required><br>

  <label>Price:</label>
  <input type="number" id="itemPrice" step="0.01" required><br>

  <label>Quantity:</label>
  <input type="number" id="itemQty" required><br><br>

  <button type="submit">Save Item</button>
</form>

<p id="message" style="font-weight: bold; margin-top: 10px;"></p>

<!-- View created items -->
<table id="itemTable" border="1" style="margin-top:20px; display: none;" class="striped-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Quantity</th>
    </tr>
  </thead>
  <tbody id="itemTableBody"></tbody>
</table>

<script>
  function createItem() {
    const item = {
      id: parseInt(document.getElementById("itemId").value),
      name: document.getElementById("itemName").value,
      price: parseFloat(document.getElementById("itemPrice").value),
      quantity: parseInt(document.getElementById("itemQty").value)
    };

    fetch("http://localhost:8080/pahana_edu_rest/api/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    })
    .then(res => {
      if (!res.ok) throw new Error("Item could not be created");
      return res.json();
    })
    .then(data => {
      document.getElementById("message").textContent = "✅ Item added successfully!";
      document.getElementById("message").style.color = "green";

      const table = document.getElementById("itemTable");
      const tbody = document.getElementById("itemTableBody");
      const row = tbody.insertRow();
      row.innerHTML = `<td>${data.id}</td><td>${data.name}</td><td>${data.price}</td><td>${data.quantity}</td>`;
      table.style.display = "table";

      document.getElementById("itemForm").reset();
    })
    .catch(err => {
      document.getElementById("message").textContent = "❌ " + err.message;
      document.getElementById("message").style.color = "red";
    });
  }
</script>
