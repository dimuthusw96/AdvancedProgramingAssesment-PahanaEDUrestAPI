<h3>Delete Item</h3>

<!-- Search Section -->
<label>Enter Item ID to Delete:</label>
<input type="number" id="itemId" required>
<button onclick="loadItem()">Search</button>
<p id="searchMsg"></p>

<!-- Item Details Display -->
<div id="itemDetails" style="display: none; margin-top: 15px;">
  <p><strong>Name:</strong> <span id="itemName"></span></p>
  <p><strong>Price:</strong> <span id="itemPrice"></span></p>
  <p><strong>Quantity:</strong> <span id="itemQty"></span></p>

  <button onclick="deleteItem()" style="color: white; background-color: red;">Delete</button>
</div>

<p id="deleteMsg" style="margin-top: 10px;"></p>

<script>
  let currentItemId = null;

  function loadItem() {
    const id = document.getElementById("itemId").value;
    if (!id) return;

    fetch(`http://localhost:8080/pahana_edu_rest/api/items/${id}`)
      .then(res => {
        if (!res.ok) throw new Error("Item not found");
        return res.json();
      })
      .then(item => {
        currentItemId = item.id;
        document.getElementById("itemName").textContent = item.name;
        document.getElementById("itemPrice").textContent = item.price;
        document.getElementById("itemQty").textContent = item.quantity;

        document.getElementById("itemDetails").style.display = "block";
        document.getElementById("searchMsg").textContent = "";
        document.getElementById("deleteMsg").textContent = "";
      })
      .catch(err => {
        document.getElementById("itemDetails").style.display = "none";
        document.getElementById("searchMsg").textContent = "❌ " + err.message;
        document.getElementById("searchMsg").style.color = "red";
      });
  }

  function deleteItem() {
    if (!confirm("Are you sure you want to delete this item?")) return;

    fetch(`http://localhost:8080/pahana_edu_rest/api/items/${currentItemId}`, {
      method: "DELETE"
    })
      .then(res => {
        if (!res.ok) throw new Error("Delete failed");
        document.getElementById("deleteMsg").textContent = "✅ Item deleted successfully!";
        document.getElementById("deleteMsg").style.color = "green";
        document.getElementById("itemDetails").style.display = "none";
      })
      .catch(err => {
        document.getElementById("deleteMsg").textContent = "❌ " + err.message;
        document.getElementById("deleteMsg").style.color = "red";
      });
  }
</script>
