<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Reorder Report</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .card-header {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }
        .critical-item {
            background-color: rgba(220, 53, 69, 0.08);
        }
        .low-item {
            background-color: rgba(255, 193, 7, 0.08);
        }
        .status-badge {
            min-width: 100px;
            font-size: 0.85rem;
        }
        .quantity-cell {
            font-weight: 600;
        }
        #lastUpdated {
            font-weight: 500;
        }
        .btn-back {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body class="bg-light">
   
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header border-0 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <button id="backBtn" class="btn btn-sm btn-back me-3">
                                <i class="bi bi-arrow-left"></i>
                            </button>
                            <div>
                                <h4 class="mb-0"><i class="bi bi-clipboard2-pulse me-2"></i>Inventory Reorder Report</h4>
                                <small class="opacity-75">Items below reorder level</small>
                            </div>
                        </div>
                        <button id="refreshBtn" class="btn btn-sm btn-light">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="text-center py-5">
                            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3 mb-0">Loading inventory data...</p>
                        </div>
                        
                        <!-- Results Container -->
                        <div id="resultsContainer" class="d-none">
                            <!-- Content will be loaded here by JavaScript -->
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 text-end text-muted">
                        <small>Last updated: <span id="lastUpdated" class="text-dark">Never</span></small>
                    </div>
                </div>
            </div>
       

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load data when page loads
            loadReorderLevels();
            
            // Set up refresh button
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadReorderLevels();
                // Add visual feedback
                const icon = this.querySelector('i');
                icon.classList.add('spin-animation');
                setTimeout(() => icon.classList.remove('spin-animation'), 1000);
            });
            
            // Set up back button
            document.getElementById('backBtn').addEventListener('click', function() {
                // You can customize where the back button goes
               history.back();// Change this to your desired back location
                // Or use history.back() to go to the previous page
                // history.back();
            });
        });

        function loadReorderLevels() {
            const spinner = document.getElementById('loadingSpinner');
            const resultsContainer = document.getElementById('resultsContainer');
            
            // Show loading, hide results
            spinner.style.display = 'block';
            resultsContainer.classList.add('d-none');
            
            // Fetch data from API
            fetch('http://localhost:8080/pahana_edu_rest/api/sales/reorderlevels')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Server returned ${response.status} status`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Update last updated timestamp
                    document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
                    
                    // Process the response
                    if (!Array.isArray(data) || data.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="alert alert-success d-flex align-items-center">
                                <i class="bi bi-check-circle-fill me-2 flex-shrink-0"></i>
                                <div>
                                    <h5 class="alert-heading mb-1">All items stocked!</h5>
                                    <p class="mb-0">No items are below their reorder levels.</p>
                                </div>
                            </div>
                        `;
                        resultsContainer.classList.remove('d-none');
                        return;
                    }
                    
                    // Create table for results
                    let html = `
                        <div class="table-responsive">
                            <table class="table table-borderless table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Item ID</th>
                                        <th>Item Name</th>
                                        <th class="text-end">Current Qty</th>
                                        <th class="text-end">Reorder Level</th>
                                        <th class="text-end">Deficit</th>
                                        <th class="text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    // Add each item to the table
                    data.forEach(item => {
                        const deficit = item.reorderlevel - item.quantity;
                        const isCritical = deficit > (item.reorderlevel * 0.3); // Critical if deficit > 30% of reorder level
                        
                        html += `
                            <tr class="${isCritical ? 'critical-item' : 'low-item'}">
                                <td class="fw-semibold">${item.id}</td>
                                <td>${item.name}</td>
                                <td class="text-end quantity-cell ${item.quantity < item.reorderlevel ? 'text-danger' : 'text-success'}">
                                    ${item.quantity}
                                </td>
                                <td class="text-end">${item.reorderlevel}</td>
                                <td class="text-end fw-bold ${deficit > 0 ? 'text-danger' : 'text-success'}">
                                    ${deficit > 0 ? deficit : '–'}
                                </td>
                                <td class="text-center">
                                    <span class="badge rounded-pill status-badge ${isCritical ? 'bg-danger' : 'bg-warning'}">
                                        <i class="bi ${isCritical ? 'bi-exclamation-triangle-fill' : 'bi-exclamation-circle-fill'} me-1"></i>
                                        ${isCritical ? 'Critical' : 'Low Stock'}
                                    </span>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="alert alert-info mt-3 d-flex align-items-center">
                            <i class="bi bi-info-circle-fill me-2 flex-shrink-0"></i>
                            <div>
                                Found ${data.length} item(s) below reorder level
                                ${data.some(item => (item.reorderlevel - item.quantity) > (item.reorderlevel * 0.3)) ? 
                                 '(<span class="text-danger fw-semibold">' + data.filter(item => (item.reorderlevel - item.quantity) > (item.reorderlevel * 0.3)).length + ' critical</span>)' : ''}
                            </div>
                        </div>
                    `;
                    
                    resultsContainer.innerHTML = html;
                    resultsContainer.classList.remove('d-none');
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultsContainer.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                            <div>
                                <h5 class="alert-heading mb-1">Error loading data</h5>
                                <p class="mb-0">${error.message}</p>
                            </div>
                        </div>
                    `;
                    resultsContainer.classList.remove('d-none');
                })
                .finally(() => {
                    spinner.style.display = 'none';
                });
        }
    </script>
    <style>
        /* Add spin animation for refresh button */
        .spin-animation {
            animation: spin 0.5s linear 1;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
