<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Report</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-header {
            font-weight: 600;
        }
        .trend-up {
            color: #28a745;
        }
        .trend-down {
            color: #dc3545;
        }
        #loadingSpinner {
            display: none;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .table-responsive {
            max-height: 500px;
            overflow-y: auto;
        }
        .back-btn {
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
        }
    </style>
</head>
<body class="bg-light" onload="checkLogin()">
    <div class="container-fluid py-4">
        <!-- Header with Back Button -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <a onclick="history.back()" class="btn btn-outline-secondary back-btn me-3">
                            <i class="bi bi-arrow-left me-1"></i> Back
                        </a>
                        <h1 class="h3 fw-bold mb-0">
                            <i class="bi bi-bar-chart-line me-2"></i>Daily Sales Report
                        </h1>
                    </div>
                    <div id="reportDateRange" class="text-muted"></div>
                </div>
            </div>
        </div>

        <!-- Filter Card -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body py-3">
                        <form id="filterForm" class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label for="startDate" class="form-label">From Date</label>
                                <input type="date" class="form-control" id="startDate">
                            </div>
                            <div class="col-md-3">
                                <label for="endDate" class="form-label">To Date</label>
                                <input type="date" class="form-control" id="endDate">
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-funnel me-1"></i> Apply Filter
                                </button>
                            </div>
                            <div class="col-md-2">
                                <button type="button" id="resetBtn" class="btn btn-outline-secondary w-100">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
                                </button>
                            </div>
                            <div class="col-md-2">
                                <button type="button" id="exportBtn" class="btn btn-success w-100">
                                    <i class="bi bi-download me-1"></i> Export CSV
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div class="row mb-4 justify-content-center">
            <div class="col-12 text-center">
                <div id="loadingSpinner" class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4 g-4" id="summaryCards">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Charts Row -->
        <div class="row mb-4 g-4">
            <div class="col-md-6">
                <div class="card h-100 shadow">
                    <div class="card-header bg-primary text-white">
                        Revenue Trend
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 shadow">
                    <div class="card-header bg-primary text-white">
                        Transactions Trend
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="transactionsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Daily Sales Details</h5>
                        <div>
                            <span class="badge bg-light text-primary me-2" id="recordCount">0 records</span>
                            <button class="btn btn-sm btn-light" id="refreshTableBtn">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="salesTable">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Date</th>
                                        <th class="text-end">Total Bills</th>
                                        <th class="text-end">Total Revenue</th>
                                        <th class="text-end">Avg. Bill Value</th>
                                        <th class="text-center">Trend</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="salesTableBody">
                                    <!-- Will be populated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-light">
                        <nav aria-label="Table navigation">
                            <ul class="pagination justify-content-center mb-0" id="pagination">
                                <!-- Will be populated by JavaScript -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
         function checkLogin() {
  const user = JSON.parse(sessionStorage.getItem("user"));
  if (!user) {
    window.location.href = "login.html";
  } else {
    const greeting = getGreeting();
    document.getElementById("username").innerText = `${greeting}, ${user.userName}`;
  }
}
        // Global variables
        let currentPage = 1;
        const rowsPerPage = 10;
        let allDailySales = [];
        let revenueChart, transactionsChart;

        // DOM Ready
        document.addEventListener('DOMContentLoaded', function() {
            // Set default dates (last 7 days)
            setDefaultDates();
            
            // Load initial data
            fetchSalesData();
            
            // Form submission
            document.getElementById('filterForm').addEventListener('submit', function(e) {
                e.preventDefault();
                currentPage = 1;
                fetchSalesData();
            });
            
            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                setDefaultDates();
                currentPage = 1;
                fetchSalesData();
            });
            
            // Export button
            document.getElementById('exportBtn').addEventListener('click', exportToCSV);
            
            // Refresh table button
            document.getElementById('refreshTableBtn').addEventListener('click', function() {
                fetchSalesData();
            });
        });

        function setDefaultDates() {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(endDate.getDate() - 7);
            
            document.getElementById('endDate').valueAsDate = endDate;
            document.getElementById('startDate').valueAsDate = startDate;
        }

        function fetchSalesData() {
            const spinner = document.getElementById('loadingSpinner');
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            spinner.style.display = 'block';
            
            // Build query parameters
            let params = new URLSearchParams();
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);
            
            fetch(`http://localhost:8080/pahana_edu_rest/api/sales/daily?${params.toString()}`)
                .then(response => {
                    if (!response.ok) {
                        console.error('API Error:', response.status, response.statusText);
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('API Response:', data);
                    if (!data.dailySales || !data.summary) {
                        throw new Error('Invalid data format from API');
                    }
                    allDailySales = data.dailySales || [];
                    updateReportDateRange(startDate, endDate);
                    updateUI(data);
                })
                .catch(error => {
                    console.error('Error fetching sales data:', error);
                    alert('Error loading sales data: ' + error.message);
                })
                .finally(() => {
                    spinner.style.display = 'none';
                });
        }

        function updateReportDateRange(startDate, endDate) {
            const dateRangeElement = document.getElementById('reportDateRange');
            if (!startDate || !endDate) {
                dateRangeElement.textContent = 'All available data';
                return;
            }
            
            const formattedStart = new Date(startDate).toLocaleDateString();
            const formattedEnd = new Date(endDate).toLocaleDateString();
            dateRangeElement.textContent = `${formattedStart} - ${formattedEnd}`;
        }

        function updateUI(data) {
            updateSummaryCards(data.summary);
            updateCharts(data.dailySales);
            updateTable(data.dailySales);
            updateRecordCount(data.dailySales.length);
        }

        function updateSummaryCards(summary) {
            const summaryCards = document.getElementById('summaryCards');
            
            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(value);
            };
            
            const trendClass = summary.overallPercentageChange >= 0 ? 'trend-up' : 'trend-down';
            const trendIcon = summary.overallPercentageChange >= 0 ? 
                '<i class="bi bi-graph-up-arrow"></i>' : 
                '<i class="bi bi-graph-down-arrow"></i>';
            const trendText = summary.overallPercentageChange >= 0 ? 'up' : 'down';
            
            summaryCards.innerHTML = `
                <div class="col-md-3">
                    <div class="card h-100 border-start border-primary border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="card-subtitle text-muted mb-2">Total Days</h6>
                                    <h2 class="card-title mb-0">${summary.totalDays}</h2>
                                </div>
                                <div class="icon-circle bg-primary bg-opacity-10 text-primary">
                                    <i class="bi bi-calendar"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100 border-start border-success border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="card-subtitle text-muted mb-2">Total Bills</h6>
                                    <h2 class="card-title mb-0">${summary.totalBills}</h2>
                                </div>
                                <div class="icon-circle bg-success bg-opacity-10 text-success">
                                    <i class="bi bi-receipt"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100 border-start border-info border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="card-subtitle text-muted mb-2">Total Revenue</h6>
                                    <h2 class="card-title mb-0">${formatCurrency(summary.totalRevenue)}</h2>
                                </div>
                                <div class="icon-circle bg-info bg-opacity-10 text-info">
                                    <i class="bi bi-cash-stack"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100 border-start border-warning border-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="card-subtitle text-muted mb-2">Avg. Bill Value</h6>
                                    <h2 class="card-title mb-0">${formatCurrency(summary.avgBillValue)}</h2>
                                    <small class="${trendClass}">
                                        ${trendIcon} ${Math.abs(summary.overallPercentageChange).toFixed(2)}% ${trendText}
                                    </small>
                                </div>
                                <div class="icon-circle bg-warning bg-opacity-10 text-warning">
                                    <i class="bi bi-currency-dollar"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCharts(dailySales) {
            // Prepare data for charts
            const dates = dailySales.map(day => new Date(day.saleDate).toLocaleDateString());
            const revenues = dailySales.map(day => day.totalRevenue);
            const transactions = dailySales.map(day => day.totalBills);
            
            // Update or create Revenue Chart
            const revenueCtx = document.getElementById('revenueChart').getContext('2d');
            if (revenueChart) {
                revenueChart.data.labels = dates;
                revenueChart.data.datasets[0].data = revenues;
                revenueChart.update();
            } else {
                revenueChart = new Chart(revenueCtx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Daily Revenue',
                            data: revenues,
                            borderColor: 'rgba(75, 192, 192, 1)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return 'Revenue: ' + new Intl.NumberFormat('en-US', {
                                            style: 'currency',
                                            currency: 'USD'
                                        }).format(context.raw);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return new Intl.NumberFormat('en-US', {
                                            style: 'currency',
                                            currency: 'USD'
                                        }).format(value);
                                    }
                                }
                            }
                        }
                    }
                });
            }
            
            // Update or create Transactions Chart
            const transactionsCtx = document.getElementById('transactionsChart').getContext('2d');
            if (transactionsChart) {
                transactionsChart.data.labels = dates;
                transactionsChart.data.datasets[0].data = transactions;
                transactionsChart.update();
            } else {
                transactionsChart = new Chart(transactionsCtx, {
                    type: 'bar',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Daily Transactions',
                            data: transactions,
                            backgroundColor: 'rgba(54, 162, 235, 0.7)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                }
                            }
                        }
                    }
                });
            }
        }

        function updateTable(dailySales) {
            const tableBody = document.getElementById('salesTableBody');
            const pagination = document.getElementById('pagination');
            
            // Clear existing rows
            tableBody.innerHTML = '';
            
            // Pagination
            const totalPages = Math.ceil(dailySales.length / rowsPerPage);
            const startIdx = (currentPage - 1) * rowsPerPage;
            const endIdx = Math.min(startIdx + rowsPerPage, dailySales.length);
            const paginatedData = dailySales.slice(startIdx, endIdx);
            
            // Format currency
            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(value);
            };
            
            // Format date
            const formatDate = (dateStr) => {
                const date = new Date(dateStr);
                return date.toLocaleDateString();
            };
            
            // Check if date is today
            const isToday = (dateStr) => {
                const today = new Date();
                const date = new Date(dateStr);
                return date.toDateString() === today.toDateString();
            };
            
            // Add rows for each day
            paginatedData.forEach(day => {
                const row = document.createElement('tr');
                
                const trendClass = day.percentageChange >= 0 ? 'trend-up' : 'trend-down';
                const trendIcon = day.percentageChange >= 0 ? 
                    '<i class="bi bi-graph-up-arrow"></i>' : 
                    '<i class="bi bi-graph-down-arrow"></i>';
                
                row.innerHTML = `
                    <td>
                        ${isToday(day.saleDate) ? '<span class="badge bg-primary me-1">Today</span>' : ''}
                        ${formatDate(day.saleDate)}
                    </td>
                    <td class="text-end">${day.totalBills}</td>
                    <td class="text-end">${formatCurrency(day.totalRevenue)}</td>
                    <td class="text-end">${formatCurrency(day.avgBillValue)}</td>
                    <td class="text-center ${trendClass}">
                        ${trendIcon} ${Math.abs(day.percentageChange).toFixed(2)}%
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary" onclick="viewDayDetails('${day.saleDate}')">
                            <i class="bi bi-eye"></i> Details
                        </button>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
            
            // Update pagination
            updatePagination(totalPages);
        }

        function updatePagination(totalPages) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            // Previous button
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a>`;
            prevLi.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    updateTable(allDailySales);
                }
            });
            pagination.appendChild(prevLi);
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                const pageLi = document.createElement('li');
                pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
                pageLi.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                pageLi.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = i;
                    updateTable(allDailySales);
                });
                pagination.appendChild(pageLi);
            }
            
            // Next button
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" aria-label="Next"><span aria-hidden="true">&raquo;</span></a>`;
            nextLi.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage < totalPages) {
                    currentPage++;
                    updateTable(allDailySales);
                }
            });
            pagination.appendChild(nextLi);
        }

        function updateRecordCount(count) {
            document.getElementById('recordCount').textContent = `${count} records`;
        }

        function exportToCSV() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            let params = new URLSearchParams();
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);
            
            window.open(`http://localhost:8080/pahana_edu_rest/api/sales/daily/export?${params.toString()}`, '_blank');
        }

        function viewDayDetails(date) {
            alert(`Viewing details for ${new Date(date).toLocaleDateString()}`);
            // In a real app, you would navigate to a details page or show a modal
        }
    </script>
</body>
</html>
